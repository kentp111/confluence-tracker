<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map of the Confluence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* A surveyor's chart of a wet city, laid on a dark table. Single theme by choice. */
  --paper: #e6dfcd;
  --paper-deep: #d6ccb3;
  --ink: #2b2622;
  --ink-soft: #625a4e;
  --water: #4d7d85;
  --water-deep: #345d64;
  --shore: #c4b792;
  --silt: #c39a5c;        /* surfaced ground */
  --iron: #9b3e2e;        /* arc one: Nine Names */
  --table: #1e1b18;       /* the room around the chart */
  --panel: #2a2622;
  --panel-rule: #4a423a;
  --display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--table); color: var(--paper);
  font-family: var(--body); font-size: 17px; line-height: 1.45;
  display: flex; flex-direction: column; min-height: 100%;
}
header {
  display: flex; align-items: baseline; gap: 18px 28px; flex-wrap: wrap;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--panel-rule);
}
header h1 { font: 400 30px/1 var(--display); margin: 0; letter-spacing: .02em; color: var(--paper); }
header h1 small { font-size: 17px; font-style: italic; color: #bfb39b; margin-left: 10px; letter-spacing: 0; }
.controls { margin-left: auto; display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; font-size: 15px; }
.controls label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; color: #d8cfba; }
.controls input { accent-color: var(--silt); width: 16px; height: 16px; margin: 0; }
.controls .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
button.ghost {
  font: 500 15px var(--body); color: var(--paper); background: transparent;
  border: 1px solid var(--panel-rule); border-radius: 6px; padding: 5px 11px; cursor: pointer;
}
button.ghost:hover { border-color: var(--paper-deep); }
button.ghost:focus-visible, .controls input:focus-visible { outline: 2px solid var(--silt); outline-offset: 2px; }

main {
  flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; min-height: 0;
}
body.panel-hidden main { grid-template-columns: minmax(0, 1fr); }
.sheet { position: relative; padding: 16px; display: flex; align-items: flex-start; justify-content: center; min-width: 0; }
.sheet svg { width: 100%; height: auto; max-height: calc(100vh - 92px); display: block;
  box-shadow: 0 2px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45); background: var(--paper); border-radius: 2px; }
aside.panel {
  background: var(--panel); border-left: 1px solid var(--panel-rule); padding: 16px 18px 24px;
  display: flex; flex-direction: column; gap: 16px; overflow: auto; max-height: calc(100vh - 60px);
}
body.panel-hidden aside.panel { display: none; }

#card {
  background: var(--paper); color: var(--ink); border-radius: 4px; padding: 14px 16px 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.35); border-top: 4px solid var(--ink);
}
#card.kind-arc { border-top-color: var(--iron); }
#card.kind-district, #card.kind-intro { border-top-color: var(--silt); }
#card h2 { font: 400 25px/1.1 var(--display); margin: 0 0 6px; text-wrap: balance; }
#card .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
#card p { margin: 0 0 8px; font-size: 16px; line-height: 1.45; }
#card .status { font-size: 14px; color: var(--ink-soft); font-style: italic; border-top: 1px solid var(--paper-deep); padding-top: 6px; margin-top: 4px; }
body.panel-hidden #card { position: absolute; left: 32px; bottom: 32px; width: min(380px, calc(100% - 64px)); }

.places h3 { font: 400 13px var(--body); letter-spacing: .16em; text-transform: uppercase; color: #a89c84; margin: 10px 0 6px; }
.places ul { list-style: none; margin: 0; padding: 0; }
.places li button {
  width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--panel-rule);
  color: var(--paper); font: 400 18px var(--display); padding: 7px 4px 7px 22px; cursor: pointer; position: relative; line-height: 1.2;
}
.places li button::before {
  content: ""; position: absolute; left: 4px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%;
  background: var(--paper); border: 1.5px solid var(--paper);
}
.places li.kind-arc button::before { background: var(--iron); border-color: var(--iron); }
.places li.kind-district button::before { background: var(--silt); border-color: var(--silt); }
.places li.unseen button::before { background: transparent; border-style: dashed; }
.places li button:hover, .places li button.active { background: rgba(230,223,205,.08); }
.places li button:focus-visible { outline: 2px solid var(--silt); outline-offset: -2px; }
.places li button small { display: block; font: italic 13px var(--body); color: #a89c84; }
.legend { font-size: 14px; color: #c9bfa8; display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; align-items: center; }
.legend svg { width: 26px; height: 16px; display: block; overflow: visible; }

/* ---------- the chart ---------- */
svg#map text { font-family: var(--display); fill: var(--ink); paint-order: stroke fill; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
svg#map .dlabel { font-size: 24px; letter-spacing: .16em; text-anchor: middle; fill: var(--ink); }
svg#map .dsub { font-size: 15px; font-style: italic; text-anchor: middle; fill: var(--ink-soft); }
svg#map .label { font-size: 21px; }
svg#map .note { font-size: 14px; font-style: italic; fill: var(--ink-soft); }
svg#map .foot { font-size: 15px; font-style: italic; fill: var(--paper); stroke: var(--water-deep); stroke-width: 4px; }
svg#map .shore path { fill: var(--shore); stroke: var(--shore); stroke-linecap: round; stroke-linejoin: round; }
svg#map .water path { fill: var(--water); stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
svg#map .current path { fill: none; stroke: #7fa7ad; stroke-linecap: round; stroke-linejoin: round; opacity: .55; stroke-dasharray: 60 90; }
svg#map .bridges use { stroke: var(--ink); fill: none; stroke-width: 2.2; }
svg#map .terrace { fill: none; stroke: var(--ink-soft); stroke-width: 2; stroke-dasharray: 3 4; stroke-linecap: round; }
svg#map .crest { fill: none; stroke: var(--water-deep); stroke-width: 2; stroke-dasharray: 10 8; opacity: .8; }
svg#map .route { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-dasharray: 1 7; stroke-linecap: round; }
svg#map .risings { fill: none; stroke: var(--iron); stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
svg#map .place, svg#map .district { cursor: pointer; outline: none; }
svg#map .halo { fill: var(--ink); opacity: 0; transition: opacity .15s; }
svg#map .place:hover .halo, svg#map .place.active .halo, svg#map .place:focus-visible .halo { opacity: .14; }
svg#map .kind-arc .halo { fill: var(--iron); }
svg#map .district .dhalo { fill: var(--silt); opacity: 0; transition: opacity .15s; }
svg#map .district:hover .dhalo, svg#map .district.active .dhalo, svg#map .district:focus-visible .dhalo { opacity: .22; }
svg#map .sym { stroke: var(--ink); fill: var(--paper); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg#map .kind-arc .sym { stroke: var(--iron); }
svg#map .unseen .sym { stroke-dasharray: 3 3; }
svg#map .glyph { stroke: var(--ink-soft); fill: var(--paper); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
svg#map.hide-arc #arc-layer { display: none; }
svg#map.hide-crest #crest-layer { display: none; }
svg#map.hide-drowned #drowned-layer { display: none; }
svg#map.hide-route #route-layer { display: none; }

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); }
  aside.panel { border-left: 0; border-top: 1px solid var(--panel-rule); max-height: none; }
  .sheet svg { max-height: none; }
  body.panel-hidden #card { position: static; width: auto; margin: 12px 0 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; }
  header .controls, aside.panel { display: none; }
  .sheet svg { box-shadow: none; max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>The Confluence <small>as the party knows it &middot; dawn of day two &middot; arc one, Nine Names</small></h1>
  <div class="controls">
    <label><input type="checkbox" id="t-arc" checked> <span class="swatch" style="background:var(--iron)"></span>Nine Names</label>
    <label><input type="checkbox" id="t-route" checked> day one's errand</label>
    <label><input type="checkbox" id="t-crest" checked> flood crest</label>
    <label><input type="checkbox" id="t-drowned" checked> the drowned city</label>
    <button class="ghost" id="t-panel" type="button">Hide panel</button>
  </div>
</header>

</main>
<script>
const PLACES = [{"id": "city", "kind": "intro", "name": "The Confluence", "blurb": "A city built where a dozen rivers braid together before the sea: half the streets are canals and the other half bridges over them. The living city stands on a drowned one, and on a cycle the flood brings the old city up with it. Twenty-four days after the crest, the water is still dropping a row at a time.", "status": "Dawn, day two of the arc. Click any place for what the party knows about it."}, {"id": "archives", "kind": "city", "name": "The archive", "district": "THE ARCHIVES", "x": 575, "y": 262, "sym": "archive", "label": {"dx": 0, "dy": 36}, "dlabel": {"x": 573, "y": 192}, "blurb": "One of the Confluence's houses of scholarship: records, salvage, and the people whose work is understanding what the water returns. Aelrith's home base. Tessin Kell works here, and the Silthic folio is bound for his dry table.", "status": "Tessin Kell · allied · not yet on screen this arc"}, {"id": "chapter", "kind": "city", "name": "The Vorgun chapter-house", "x": 1085, "y": 588, "sym": "temple", "label": {"dx": 0, "dy": 38}, "blurb": "Small, old and undermanned: a temple with a drill-yard and no garrison. It takes in the dying without asking who they are, walks salvage across town, and is one of the few places in the city that knows what to do about the risen dead. Home base for Brann and Brogga; Halvi Dorn keeps it. The party long-rested here last night, and Denno is at the end of its long table.", "status": "Halvi Dorn · allied · holds two Potions of Healing"}, {"id": "lowq", "kind": "district", "name": "The low quarter", "district": "THE LOW QUARTER", "dlabel": {"x": 1100, "y": 748}, "sub": "goes under first, every cycle", "glyph": {"sym": "lowq", "x": 1100, "y": 800}, "blurb": "The poorest and wettest district, built half into the surfaced layers of the drowned city, so it goes under first and hardest every cycle. Home of the undeclared: unlicensed salvagers, families off boats with no manifest, anyone the city has no file on. When it floods the rescue is slow. Nova grew up here; his mother Ithe Vask made papers here for thirty years.", "status": "Nova's streets"}, {"id": "markets", "kind": "district", "name": "The markets", "district": "THE MARKETS", "dlabel": {"x": 592, "y": 575}, "glyph": {"sym": "market", "x": 592, "y": 612}, "blurb": "Where trade, salvage and rumour change hands. Whatever enters the interior or leaves for the sea is bought and sold somewhere along here first.", "status": ""}, {"id": "docks", "kind": "district", "name": "The docks", "district": "THE DOCKS", "dlabel": {"x": 640, "y": 848}, "glyph": {"sym": "dock", "x": 640, "y": 804}, "blurb": "Goods, people and rumour move by boat, and everything bound for the sea or the interior passes through the docks.", "status": ""}, {"id": "steps", "kind": "district", "name": "The Steps", "district": "THE STEPS", "dlabel": {"x": 1365, "y": 378}, "sub": "surfaced this cycle", "blurb": "A surfaced district: terraces of old vault-houses stepping down to the water, lifted into reach by this cycle's flood. A burial ground of the drowned city, four centuries under water. Seven or nine risings in fourteen days, all within three streets of the landing and nowhere else in the city.", "status": "risings · the ring on the map"}, {"id": "landing", "kind": "arc", "name": "The Steps landing", "x": 1275, "y": 500, "sym": "landing", "label": {"dx": 0, "dy": 34}, "blurb": "Sath Oru's winch frame. Her crew of nine has worked the Steps since day four after the crest, chiselling name-slates out of wall-niches for a buyer nobody has met; a man she calls “the clerk” brings the coin. All nine are now registered and Sath's price has been met, but she has not yet heard it from the party. Baske walked back here alone last night to tell her.", "status": "Sath Oru · neutral · watching Nova"}, {"id": "stripped", "kind": "arc", "name": "The Stripped House", "x": 1335, "y": 552, "sym": "house", "label": {"dx": 0, "dy": 36}, "blurb": "A vault-house of twenty-four niches, each a forearm-deep socket with a body folded inside. The slates were the doors; three bodies rose when theirs were taken. Twenty-one hand-cut names are now set and nothing here will rise again. First-light appointment: six of Sath's crew, two from the chapter-house and a boy, waiting at this door to be taught the method.", "status": "cleared · appointment at first light"}, {"id": "terrace2", "kind": "arc", "name": "The second terrace", "x": 1385, "y": 616, "sym": "terrace", "unseen": true, "label": {"dx": 0, "dy": 34}, "note": "two more stripped houses", "blurb": "Two more stripped vault-houses. Nobody has walked them. More terraces lie below the waterline that nobody has walked either.", "status": "unwalked"}, {"id": "yardwall", "kind": "arc", "name": "The yard-wall", "x": 1445, "y": 690, "sym": "slab", "unseen": true, "label": {"dx": 0, "dy": 36}, "note": "the deep part · unseen", "blurb": "Seven feet by four, set in the yard-wall in the deep part of the Steps. The last payment, bought in advance, due to come off at first light on day four when the sledge track goes dry. Nobody has read it or seen it. That it is the ground's master roll is Aelrith's inference, not a confirmed fact. Halvi's instruction: read it before anyone starts work.", "status": "unseen · the day-four clock"}, {"id": "wellers", "kind": "arc", "name": "Weller's Stair", "x": 1110, "y": 462, "sym": "stair", "label": {"dx": 0, "dy": -24}, "blurb": "The Cut: a drainage cut with a sluice gate, where the errand went wrong. Brogga pulled the jammed beam and drained it; three skeletons and a zombie went down; Denno came out alive. Nobody has looked under the barge tarpaulin.", "status": "cleared · tarpaulin unchecked"}, {"id": "bridge", "kind": "arc", "name": "The bridge", "x": 924, "y": 505, "sym": "bridgemark", "label": {"dx": -22, "dy": 8, "anchor": "end"}, "blurb": "Where the party took its first short rest, and where Brann tore a leaf from his travelling name-roll and wrote Denno a note to Halvi. “What's your other name?” “Haven't got one.” “Then I'll write Denno.”", "status": "short rest, day one"}, {"id": "guild", "kind": "arc", "name": "The guild yard", "x": 870, "y": 575, "sym": "guild", "label": {"dx": 0, "dy": 36}, "blurb": "Where the eleven crates were delivered and Aelrith pulled the manifest as of right: loaded at the Steps landing, crew “Oru, S.” with the licence column blank, consigned to O. Pell, Assistant Registrar, carriage paid in advance in cash. Nobody has told the guild anything.", "status": "guild uninformed"}, {"id": "rolls", "kind": "arc", "name": "The Rolls Office", "x": 840, "y": 322, "sym": "rolls", "label": {"dx": 0, "dy": 36}, "blurb": "The Salvage Rolls, three volumes, kept by Ondrey Pell, Assistant Registrar, who believes a discretionary provision lets him enter undeclared persons on an employer's attestation. All nine of Sath's crew are in the book; the “Rill” entry is struck, one ruled line, dated and initialled. The city's books are clean. Reopens this morning.", "status": "Pell · neutral · unsuspecting"}];
const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const cityLayer = document.getElementById("city-layer");
const arcLayer = document.getElementById("arc-layer");
const card = document.getElementById("card");
const placesEl = document.getElementById("places");

function el(name, attrs, text) {
  const n = document.createElementNS(svgNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

function drawPlace(p) {
  const g = el("g", { class: "place kind-" + p.kind + (p.unseen ? " unseen" : ""), "data-id": p.id, tabindex: "0", role: "button", "aria-label": p.name });
  g.appendChild(el("circle", { class: "halo", cx: p.x, cy: p.y, r: 26 }));
  g.appendChild(el("use", { href: "#sym-" + p.sym, class: "sym", x: p.x, y: p.y }));
  const anchor = p.label.anchor || "middle";
  g.appendChild(el("text", { class: "label", x: p.x + p.label.dx, y: p.y + p.label.dy, "text-anchor": anchor }, p.name));
  if (p.note) g.appendChild(el("text", { class: "note", x: p.x + p.label.dx, y: p.y + p.label.dy + 18, "text-anchor": anchor }, p.note));
  (p.kind === "arc" ? arcLayer : cityLayer).appendChild(g);
}

function drawDistrict(p) {
  const g = el("g", { class: "district kind-" + p.kind, "data-id": p.id, tabindex: "0", role: "button", "aria-label": p.name });
  const w = p.district.length * 19 + 24;
  g.appendChild(el("rect", { class: "dhalo", x: p.dlabel.x - w / 2, y: p.dlabel.y - 24, width: w, height: p.sub ? 50 : 32, rx: 6 }));
  g.appendChild(el("text", { class: "dlabel", x: p.dlabel.x, y: p.dlabel.y }, p.district));
  if (p.sub) g.appendChild(el("text", { class: "dsub", x: p.dlabel.x, y: p.dlabel.y + 20 }, p.sub));
  if (p.glyph) g.appendChild(el("use", { href: "#sym-" + p.glyph.sym, class: "glyph", x: p.glyph.x, y: p.glyph.y }));
  cityLayer.appendChild(g);
}

PLACES.forEach(p => {
  if (p.kind === "intro") return;
  if (p.district && !p.x) drawDistrict(p);
  else {
    drawPlace(p);
    if (p.district) drawDistrict(Object.assign({}, p, { x: undefined, id: p.id, kind: "district" }));
  }
});

function show(id) {
  const p = PLACES.find(q => q.id === id) || PLACES[0];
  card.className = "kind-" + p.kind;
  const eyebrow = p.kind === "arc" ? "Arc one · Nine Names" : p.kind === "district" ? "District" : p.kind === "city" ? "The living city" : "The city";
  card.innerHTML = '<div class="eyebrow">' + eyebrow + '</div><h2></h2><p></p>' + (p.status ? '<div class="status"></div>' : '');
  card.querySelector("h2").textContent = p.name;
  card.querySelector("p").textContent = p.blurb;
  if (p.status) card.querySelector(".status").textContent = p.status;
  document.querySelectorAll(".active").forEach(n => n.classList.remove("active"));
  document.querySelectorAll('[data-id="' + id + '"]').forEach(n => n.classList.add("active"));
}

svg.addEventListener("click", e => {
  const g = e.target.closest("[data-id]");
  if (g) show(g.getAttribute("data-id"));
});
svg.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const g = e.target.closest("[data-id]");
    if (g) { e.preventDefault(); show(g.getAttribute("data-id")); }
  }
});

// the list
function section(title, items) {
  const h = document.createElement("h3"); h.textContent = title;
  const ul = document.createElement("ul");
  items.forEach(p => {
    const li = document.createElement("li");
    li.className = "kind-" + p.kind + (p.unseen ? " unseen" : "");
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("data-id", p.id);
    b.textContent = p.name;
    if (p.status) { const s = document.createElement("small"); s.textContent = p.status; b.appendChild(s); }
    b.addEventListener("click", () => show(p.id));
    li.appendChild(b); ul.appendChild(li);
  });
  placesEl.appendChild(h); placesEl.appendChild(ul);
}
section("The living city", PLACES.filter(p => p.kind === "city" || p.kind === "district"));
section("Arc one · Nine Names", PLACES.filter(p => p.kind === "arc"));

// toggles
const toggles = { "t-arc": "hide-arc", "t-route": "hide-route", "t-crest": "hide-crest", "t-drowned": "hide-drowned" };
for (const id in toggles) {
  document.getElementById(id).addEventListener("change", e => svg.classList.toggle(toggles[id], !e.target.checked));
}
const panelBtn = document.getElementById("t-panel");
const sheet = document.querySelector(".sheet");
const panel = document.querySelector("aside.panel");
panelBtn.addEventListener("click", () => {
  const hidden = document.body.classList.toggle("panel-hidden");
  panelBtn.textContent = hidden ? "Show panel" : "Hide panel";
  if (hidden) sheet.appendChild(card); else panel.insertBefore(card, panel.firstChild);
});

show("city");
</script>
